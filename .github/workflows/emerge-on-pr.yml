name: emerge-on-pr

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - 'metadata/**'
      - 'profiles/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: select emerge targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      targets: ${{ steps.packages.outputs.targets }}
      image: ${{ steps.image.outputs.ref }}

    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: scan changed ebuilds
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
      id: packages
      run: |
        targets=$(scripts/emerge-targets.sh "$PR")
        echo "targets=$targets" >> "$GITHUB_OUTPUT"

    - name: set image name
      id: image
      run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stage3" >> "$GITHUB_OUTPUT"

  build:
    name: emerge ${{ matrix.target.package }} (${{ matrix.target.profile }})
    needs: scan
    if: fromJSON(needs.scan.outputs.targets)[0] != null
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.scan.outputs.targets) }}

    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.scan.outputs.image }}:${{ matrix.target.profile }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged

    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}

    - name: setup portage config
      uses: ./.github/actions/setup-gentoo

    - name: setup cpu flags
      env:
        ATOM: ${{ matrix.target.package }}
      run: |
        if scripts/needs-cpu-flags.sh "$ATOM"; then
          FEATURES="getbinpkg" emerge --oneshot --quiet app-portage/cpuid2cpuflags
          echo "$ATOM $(cpuid2cpuflags)" > /etc/portage/package.use/cpu-flags
          cat /etc/portage/package.use/cpu-flags
        fi

    - name: emerge --onlydeps packages
      env:
        ATOM: ${{ matrix.target.package }}
      run: |
        FEATURES="getbinpkg" emerge --onlydeps --jobs 2 --quiet --verbose --autounmask=y --autounmask-write=y --autounmask-continue=y "$ATOM"
        rm -rf /var/log/portage/elog/*

    - name: emerge packages
      env:
        ATOM: ${{ matrix.target.package }}
      run: emerge --verbose --autounmask=y --autounmask-write=y --autounmask-continue=y "$ATOM"

    - name: check portage elog
      run: |
        if ls /var/log/portage/elog/* 1> /dev/null 2>&1; then
          echo "Found Portage elog messages:"
          cat /var/log/portage/elog/*
          exit 1
        fi
        echo "No elog messages found."
