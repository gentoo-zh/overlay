name: stage3

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: stage3
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: stage3 ${{ matrix.profile }}
    if: github.repository == 'gentoo-zh/overlay' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: amd64-desktop-openrc
            runner: ubuntu-latest
          - profile: amd64-desktop-systemd
            runner: ubuntu-latest
          - profile: arm64-desktop-systemd
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: set image name
      id: image
      env:
        PROFILE: ${{ matrix.profile }}
      # a dated tag keeps the image a pull request ran on after the profile tag moves
      run: |
        ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stage3:$PROFILE
        dated=$ref-$(date -u +%Y%m%d)
        base=$(docker buildx imagetools inspect "gentoo/stage3:$PROFILE" --format '{{.Manifest.Digest}}') || base=unknown
        {
          echo "tags=$ref,$dated"
          echo "dated=$dated"
          echo "base=$base"
        } >> "$GITHUB_OUTPUT"

    - name: log in to ghcr
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: build and push
      uses: docker/build-push-action@v7
      with:
        context: .github/stage3
        build-args: |
          PROFILE=${{ matrix.profile }}
          IMAGE=${{ steps.image.outputs.dated }}
          BASE=${{ steps.image.outputs.base }}
          RUN=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        push: true
        no-cache: true
        # attestation manifests are untagged and the cleanup would delete them
        provenance: false
        tags: ${{ steps.image.outputs.tags }}

  cleanup:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
    - name: drop replaced images
      uses: actions/delete-package-versions@v5
      with:
        owner: ${{ github.repository_owner }}
        package-name: stage3
        package-type: container
        delete-only-untagged-versions: true
        min-versions-to-keep: 0

    # a week of dated images, one per profile a day; only after every profile built, so
    # the newest image of each profile is among those kept
    - name: drop superseded images
      if: needs.build.result == 'success'
      uses: actions/delete-package-versions@v5
      with:
        owner: ${{ github.repository_owner }}
        package-name: stage3
        package-type: container
        min-versions-to-keep: 21
