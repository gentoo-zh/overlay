# autobump: try the mechanical version bumps that nvchecker filed as issues.
#
# Design:
# - The plan job resolves the queue against cached state and hands workers disjoint shards;
#   workers share no state and collect merges their deltas.
# - No model anywhere while AUTOBUMP_JUDGE is unset: whatever is not mechanically safe gets
#   an evidence comment on its issue and stops. The judge hook in autobump-sweep.py is for
#   later, where semantic judgment is worth a cheap model call.
# - Mechanical bumps become normal PRs (draft when multi-arch), so emerge-on-pr and pkgcheck
#   re-verify everything and a human is still the only merger.
#
# Requires: repo setting "Allow GitHub Actions to create and approve pull
# requests", and maintainer agreement that the bot pushes its topic branches
# to this repo (the engine names them <category>-<pn>-<version>).
#
# Engine: autobump-rb (Ruby, cloned per-run, github.com/gentoo-zh/autobump-rb), driven via
# AUTOBUMP_ENGINE. Its stage-6 build test is a real `emerge` (build deps via getbinpkg), so
# from-source packages are actually build-tested, not just `ebuild install`; it also
# escalates hackport/haskell-cabal bumps (dep bounds come from the upstream .cabal).

name: autobump

on:
  # chained to nvchecker rather than a clock: scheduled runs here start hours after their
  # cron, so a fixed offset cannot keep autobump behind the issues it reads
  workflow_run:
    workflows: [nvchecker]
    types: [completed]
    # a manual nvchecker run from a topic branch is not the daily queue
    branches: [master]
  # backstop: if nvchecker stops running, the queue would go quiet with nothing saying so
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      issues:
        description: 'issue numbers, space separated (empty = all open)'
        required: false
        default: ''
      limit:
        description: 'max issues per run (0 = the whole queue)'
        required: false
        default: '0'
      retry:
        description: 'run the named issues again even if they are already recorded'
        type: boolean
        default: false
      rebuild_env:
        description: 'rebuild the worker environment image'
        type: boolean
        default: false
      env_date:
        description: 'run on an earlier environment image (YYYYMMDD, empty = today)'
        required: false
        default: ''

concurrency:
  group: autobump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # the queue is the open issues, not nvchecker's output, so a failed issue or dispatch job
  # there does not hold the bumps back; only a cancelled run skips
  wait:
    if: >-
      (github.repository == 'gentoo-zh/overlay' || github.event_name == 'workflow_dispatch')
      && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
    # the issues exist by now; this waits on the search index the queue is read through
    - name: wait for the issues to settle
      if: github.event_name == 'workflow_run'
      run: sleep 60

  # after plan, so a run with an empty queue builds nothing
  env:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.plan).matrix.include[0] != null }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/autobump-env.yml
    with:
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_env }}
      date: ${{ inputs.env_date || '' }}

  # only the workers need portage, and a container start costs a 3.5 GB pull
  plan:
    needs: wait
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}

    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: mint app token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ secrets.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: gentoo-zh
        repositories: overlay

    - name: restore state
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.autobump-state/autobump
        key: autobump-state-${{ github.run_id }}
        restore-keys: autobump-state-

    - name: plan
      id: plan
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        XDG_STATE_HOME: ${{ github.workspace }}/.autobump-state
        ISSUES: ${{ github.event.inputs.issues }}
        LIMIT: ${{ github.event.inputs.limit || 0 }}
        RETRY: ${{ github.event.inputs.retry == 'true' && '--retry' || '' }}
        SHARDS: '8'
      run: |
        # validate before use: ISSUES is space-separated issue numbers, LIMIT and SHARDS are ints.
        case "$ISSUES" in *[!0-9\ ]*) echo "issues must be numbers: $ISSUES" >&2; exit 1;; esac
        case "$LIMIT" in ''|*[!0-9]*) echo "limit must be a number: $LIMIT" >&2; exit 1;; esac
        # $ISSUES intentionally unquoted so it word-splits into positional args (validated above).
        plan=$(python3 scripts/autobump-sweep.py $ISSUES $RETRY --limit "$LIMIT" --plan "$SHARDS")
        echo "plan=$plan" >> "$GITHUB_OUTPUT"

  bump:
    needs: [env, plan]
    # a job-level block replaces the workflow defaults, so all four are listed
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: read
    if: ${{ fromJSON(needs.plan.outputs.plan).matrix.include[0] != null }}
    runs-on: ubuntu-latest
    # a worker's fixed cost is paid in parallel, so more shards only shorten the tail one
    # slow package leaves behind
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.plan).matrix }}
    # A heavy from-source dep (e.g. net-libs/nodejs for the pnpm/npm family) can take ~1h+; give the
    # per-op ceiling (AUTOBUMP_OP_TIMEOUT below) room for it and keep this job ceiling above one such
    # build plus a tail of light packages, so a heavy build finishes instead of being cut off mid-run.
    timeout-minutes: 360
    container:
      image: ${{ needs.env.outputs.image }}
      # the image is private until someone makes it public; do not depend on which it is
      credentials:
        username: gentoo-zh-bot
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged

    steps:
    - name: sync gentoo main tree
      run: emerge-webrsync --no-pgp-verify

    # both describe the runner, so the image cannot carry them; without the flags a
    # cpu_flags_x86 REQUIRED_USE reads as a build failure
    - name: tune portage for this runner
      run: |
        echo "MAKEOPTS=\"\${MAKEOPTS} -j$(nproc)\"" >> /etc/portage/make.conf
        echo "*/* $(cpuid2cpuflags)" > /etc/portage/package.use/autobump-cpuflags

    # every shard restores, one saves: an entry holds the whole directory, and eight
    # near-copies a day would evict the rest of the repo's 10 GB
    - name: restore dependency binpkgs
      uses: actions/cache/restore@v6
      with:
        path: /var/cache/binpkgs
        key: autobump-binpkgs-${{ github.run_id }}
        restore-keys: autobump-binpkgs-

    - name: checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: fetch autobump-rb (the Ruby engine)
      uses: actions/checkout@v7
      with:
        repository: gentoo-zh/autobump-rb
        path: autobump-rb

    - name: register overlay
      run: |
        mkdir -p /etc/portage/repos.conf
        # pkgcore (pkgdev/pkgcheck) reads /etc/portage/repos.conf/ but NOT portage's
        # built-in default, so the gentoo repo must be declared here explicitly or
        # `pkgdev manifest` aborts with "default repo 'gentoo' is undefined or invalid".
        cat > /etc/portage/repos.conf/gentoo.conf << EOF
        [DEFAULT]
        main-repo = gentoo

        [gentoo]
        location = $(portageq get_repo_path / gentoo)
        EOF
        cat > /etc/portage/repos.conf/repo.conf << EOF
        [$(cat profiles/repo_name)]
        location = $(realpath .)
        priority = 0
        EOF

    # Mint an installation token for the gentoo-zh-autobump GitHub App. A PR opened with
    # the default GITHUB_TOKEN (github-actions[bot]) does NOT trigger emerge-on-pr/pkgcheck
    # -- GitHub blocks recursive workflow triggers -- so the verification safety net would
    # never run. An App token opens the PR as gentoo-zh-autobump[bot], which DOES trigger it.
    - name: mint app token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ secrets.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        # the App is installed on gentoo-zh/overlay; name it explicitly so the token
        # resolves whether this workflow runs on the overlay or on a fork (dispatch test).
        owner: gentoo-zh
        repositories: overlay

    - name: git identity
      run: |
        git config --global --add safe.directory "$(realpath .)"
        git config user.name  "gentoo-zh-bot"
        git config user.email "bot@gentoozh.org"

    - name: bump shard
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        # sync master from origin: after deploy, origin IS gentoo-zh/overlay, so this pulls
        # the latest master to bump against. LIVE_OVERLAY is left at its default -- the CI
        # overlay checkout is itself the registered repo, so separate_overlay is false and
        # the emerge runs against the workspace directly (no host-path ${{ github.workspace }}).
        AUTOBUMP_SYNC_REMOTE: origin
        # relative path on purpose: in a CONTAINER job ${{ github.workspace }} expands to
        # the HOST path (/home/runner/work/...), but the container mounts the workspace at
        # /__w/..., so an absolute host path does not exist inside the container. The sweep
        # cd's into the overlay (= the workspace), so a path relative to it always resolves.
        AUTOBUMP_ENGINE: ruby autobump-rb/bin/autobump
        # allow a generous per-op ceiling so a heavy from-source build (net-libs/nodejs ~1h)
        # finishes instead of timing out and deferring; keep in step with timeout-minutes above.
        AUTOBUMP_OP_TIMEOUT: '7200'
        # inside the container: ${{ runner.temp }} is a host path the container lacks
        AUTOBUMP_EVIDENCE_DIR: /tmp/autobump-evidence
        SHARD: ${{ toJSON(fromJSON(needs.plan.outputs.plan).shards[matrix.shard]) }}
        SHARD_ID: ${{ matrix.shard }}
        LIMIT: ${{ github.event.inputs.limit || 0 }}
      run: python3 scripts/autobump-sweep.py --worker "$SHARD" --delta "autobump-delta-$SHARD_ID.json" --limit "$LIMIT" --pr --comment

    - name: save dependency binpkgs
      if: always() && matrix.shard == 0
      uses: actions/cache/save@v6
      with:
        path: /var/cache/binpkgs
        key: autobump-binpkgs-${{ github.run_id }}

    - name: upload shard delta
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: autobump-delta-${{ matrix.shard }}
        path: autobump-delta-${{ matrix.shard }}.json

    - name: upload escalation evidence
      if: always()
      # evidence is for reading afterwards; losing it must not fail a bump that worked
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: autobump-evidence-${{ matrix.shard }}
        path: /tmp/autobump-evidence
        if-no-files-found: ignore

  collect:
    needs: [plan, bump]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: restore state
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.autobump-state/autobump
        key: autobump-state-${{ github.run_id }}
        restore-keys: autobump-state-

    - name: download shard deltas
      if: ${{ needs.bump.result != 'skipped' && needs.bump.result != 'cancelled' }}
      uses: actions/download-artifact@v8
      with:
        pattern: autobump-delta-*
        path: autobump-deltas
        merge-multiple: true

    - name: collect
      env:
        XDG_STATE_HOME: ${{ github.workspace }}/.autobump-state
        PLAN: ${{ needs.plan.outputs.plan }}
      run: |
        shopt -s nullglob
        python3 scripts/autobump-sweep.py --collect "$PLAN" autobump-deltas/*.json

    - name: save state
      if: success()
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/.autobump-state/autobump
        key: autobump-state-${{ github.run_id }}
