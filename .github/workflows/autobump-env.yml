# The bump workers' environment image, tagged by ref and date: one build a day, and a
# branch test never overwrites what the scheduled runs pull.

name: autobump-env

on:
  workflow_call:
    inputs:
      force:
        description: rebuild even if today's image exists
        type: boolean
        default: false
      date:
        description: use the image of an earlier day (YYYYMMDD); it must still be kept
        type: string
        default: ''
    outputs:
      image:
        description: the image the bump workers run in
        value: ${{ jobs.build.outputs.image }}
  workflow_dispatch:
    inputs:
      force:
        description: rebuild even if today's image exists
        type: boolean
        default: true
      date:
        description: use the image of an earlier day (YYYYMMDD); it must still be kept
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
    - name: checkout
      uses: actions/checkout@v7

    # ghcr takes neither an uppercase name nor the characters a git ref may carry
    - name: image name
      id: image
      env:
        OWNER: ${{ github.repository_owner }}
        REF: ${{ github.ref_name }}
        DAY: ${{ inputs.date }}
      run: |
        case "$DAY" in ''|[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
          *) echo "date must be YYYYMMDD: $DAY" >&2; exit 1;; esac
        owner=$(printf '%s' "$OWNER" | tr 'A-Z' 'a-z')
        tag=$(printf '%s' "$REF" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9._-' '-')
        echo "ref=ghcr.io/$owner/autobump-env:$tag-${DAY:-$(date -u +%Y%m%d)}" >> "$GITHUB_OUTPUT"
        echo "base=ghcr.io/$owner/stage3:amd64-desktop-openrc" >> "$GITHUB_OUTPUT"

    - name: log in to ghcr
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: gentoo-zh-bot
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: look for the image
      id: existing
      env:
        REF: ${{ steps.image.outputs.ref }}
        DAY: ${{ inputs.date }}
      run: |
        # stdout is the manifest, stderr is why it is not there - keep the second
        if docker manifest inspect "$REF" > /dev/null; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        elif [ -n "$DAY" ]; then
          # an earlier day cannot be rebuilt: its tree and binpkgs are gone
          echo "no image for $DAY: $REF" >&2
          exit 1
        fi

    # no build cache: the point of rebuilding is to pick up today's tree and binpkgs
    - name: build and push
      id: build
      if: ${{ inputs.date == '' && (inputs.force || steps.existing.outputs.exists != 'true') }}
      uses: docker/build-push-action@v7
      with:
        context: .github/autobump-env
        build-args: BASE=${{ steps.image.outputs.base }}
        push: true
        no-cache: true
        # no attestation manifests: the cleanup below deletes untagged versions
        provenance: false
        tags: ${{ steps.image.outputs.ref }}

    # rebuilding a day leaves the version it replaced untagged, taking a slot below
    - name: drop replaced images
      uses: actions/delete-package-versions@v5
      with:
        owner: ${{ github.repository_owner }}
        package-name: autobump-env
        package-type: container
        delete-only-untagged-versions: true
        min-versions-to-keep: 0

    # keep three days, the range env_date can fall back to
    - name: drop superseded images
      if: steps.build.outcome == 'success'
      uses: actions/delete-package-versions@v5
      with:
        owner: ${{ github.repository_owner }}
        package-name: autobump-env
        package-type: container
        min-versions-to-keep: 3
