name: nvchecker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 09 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eix:
    if: github.repository == 'gentoo-zh/overlay'
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3
      options: --privileged
    outputs:
      pkgs: ${{ steps.eix.outputs.pkgs }}
    steps:
    - name: sync gentoo main tree
      run: |
        emerge-webrsync --no-pgp-verify

    - name: setup features
      run: |
        echo 'FEATURES="getbinpkg"' >> /etc/portage/make.conf
        getuto

    - name: install depends
      run: |
        emerge --verbose --quiet --jobs "$(nproc)" --autounmask y --autounmask-continue y \
        app-eselect/eselect-repository \
        app-portage/eix \
        dev-vcs/git

    - name: setup gentoo git repo
      run: |
        eselect repository add gentoo git https://github.com/gentoo-mirror/gentoo.git
        rm -rf /var/db/repos/gentoo
        emaint sync -r gentoo

    - name: checkout
      uses: actions/checkout@v7

    - name: eix
      id: eix
      run: scripts/nvchecker-eix.sh

  nvchecker:
    needs: eix
    runs-on: ubuntu-latest
    outputs:
      nvcmp: ${{ steps.nvchecker.outputs.nvcmp }}
    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: install depends
      run: |
        pip install nvchecker jq portage

    - name: echo pkgs
      env:
        PACKAGES: ${{ needs.eix.outputs.pkgs }}
      run: echo "$PACKAGES"

    - name: nvchecker
      id: nvchecker
      env:
        GITHUB_TOKEN: ${{ secrets.GENTOO_ZH_NVCHECKER_PAT }}
        PACKAGES: ${{ needs.eix.outputs.pkgs }}
        NVCHECKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -o pipefail
        echo "::group::nvchecker"
        cd .github/workflows/
        printf '%s\n' "$PACKAGES" > old_ver.json
        printf '[keys]\ngithub = "%s"\n' "$NVCHECKER_TOKEN" > keyfile.toml
        nvchecker --file overlay.toml --keyfile keyfile.toml
        echo "::endgroup::"

        echo "::group::check versions"
        ../../scripts/nvchecker-check.py overlay.toml old_ver.json new_ver.json
        echo "::endgroup::"

        echo "::group::nvcmp"
        # Tree oldver needs --sort portage: PEP440 misreads _p/_rc and reports downgrades as updates.
        nvcmp=$(nvcmp --file overlay.toml --json --newer --sort portage \
          | jq 'map({name, newver, oldver})' | jq -c .)
        echo "nvcmp=${nvcmp}" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"

  issues-bumper:
    needs: nvchecker
    if: needs.nvchecker.outputs.nvcmp != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.nvchecker.outputs.nvcmp) }}
    steps:
    - name: Checkout bumpbot
      uses: actions/checkout@v7
      with:
        repository: 'gentoo-zh-drafts/bumpbot'

    - name: Checkout gentoo-zh
      uses: actions/checkout@v7
      with:
        path: 'gentoo-zh'

    - name: update issues
      timeout-minutes: 1
      env:
        name: ${{ matrix.name }}
        newver: ${{ matrix.newver }}
        oldver: ${{ matrix.oldver }}
        GITHUB_TOKEN: ${{ secrets.GENTOO_ZH_NVCHECKER_PAT }} # https://github.com/gentoo-zh/overlay/pull/3130
      run: |
        go run . --file gentoo-zh/.github/workflows/overlay.toml --name "$name" --newver "$newver" --oldver "$oldver"
