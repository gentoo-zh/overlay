["x11-misc/picom-jonaburg"]
source = "github"
github = "jonaburg/picom"
use_latest_tag = true
prefix = "v"

["x11-terms/blackbox-terminal"]
source = "gitlab"
gitlab = "raggesilver/blackbox"
host = "gitlab.gnome.org"
use_max_tag = true
prefix = "v"
exclude_regex = ".*alpha.*|.*beta.*|.*rc.*"
github_account = ["zakkaus", "gouwazi"]

["x11-terms/termius"]
source = "jq"
url = "https://formulae.brew.sh/api/cask/termius.json"
filter = ".version"
github_account = "zakkaus"
autobump = true

["x11-terms/wezterm-bin"]
source = "github"
github = "wez/wezterm"
use_latest_release = true
from_pattern = "(.*)-(.*)-(.*)"
to_pattern = "\\1"
github_account = ["oatiz", "gouwazi"]

